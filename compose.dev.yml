# Локальное окружение бэкенда: PostgreSQL, MinIO, Mailpit и сам бэкенд.
#   docker compose -f compose.dev.yml up --build
# API — http://localhost:8080 (Swagger UI: /docs), письма — http://localhost:8025,
# консоль MinIO — http://localhost:9001 (minio / minio-secret).
# Порты на хосте меняются переменными DEV_*_PORT, если стандартные заняты.
# Секреты ниже — только для разработки.
name: maxim-dev

x-backend-env: &backend-env
  APP_ENV: development
  LOG_LEVEL: debug
  DATABASE_URL: postgres://maxim_app:maxim_app@postgres:5432/maxim?sslmode=disable
  S3_ENDPOINT: minio:9000
  S3_REGION: us-east-1
  S3_BUCKET_PRIVATE: maxim-private
  # Публичная корзина производных из версий поста (R-7); адрес — с хоста разработчика.
  S3_BUCKET_PUBLIC: maxim-public
  S3_PUBLIC_BASE_URL: http://localhost:${DEV_MINIO_PORT:-9000}/maxim-public
  # Подписанные ссылки кабинета открываются в браузере на хосте, а не внутри сети compose.
  S3_PRESIGN_ENDPOINT: localhost:${DEV_MINIO_PORT:-9000}
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio-secret
  S3_USE_SSL: "false"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_TLS: none
  MAIL_FROM: noreply@maxim.local
  APP_SECRETS_KEY: ZGV2LW9ubHktc2VjcmV0cy1rZXktMzItYnl0ZXMhISE=
  AUTH_CODE_PEPPER: dev-only-pepper-at-least-32-characters
  COOKIE_SECURE: "false"
  # MAX без токена бота — поддельный адаптер; оповещения дежурным уходят в Mailpit.
  ALERT_EMAILS: oncall@maxim.local
  # Webhook MAX: события можно отправить вручную (README, «Подключение канала в разработке»).
  MAX_BOT_NAME: "@maxim_dev_bot"
  MAX_WEBHOOK_PATH_SECRET: dev-only-webhook-path-secret-0123456789
  MAX_WEBHOOK_SECRET: dev-only-webhook-header-secret-012345678
  # Каталог: комиссия платформы 15 % (README, «Канал до каталога в разработке»).
  PLATFORM_FEE_RATE_BP: "1500"
  # Заказ и размещения: сроки T-01, T-13 и правила времени публикации (03 §5, A-10).
  PLACEMENT_ACCEPT_TIMEOUT: 24h
  PLACEMENT_SCHEDULE_TIMEOUT: 24h
  PLACEMENT_WINDOW_GUARD: 1h
  PLACEMENT_MIN_LEAD: 1h
  PLACEMENT_SLOT_STEP: 5m
  PLACEMENT_REEDIT_GUARD: 24h
  CART_MAX_ITEMS: "50"
  # Автопостинг и контроль: повторы публикации (T-03) и снятия (T-10), сверка (T-09), споры (T-06).
  PUBLISH_RETRY_WINDOW: 30m
  PUBLISH_RETRY_INTERVAL: 30s
  REMOVE_RETRY_WINDOW: 24h
  PLACEMENT_CLAIM_WINDOW: 24h
  DISPUTE_DEADLINE: 72h
  RECONCILE_INTERVAL: 5m
  # Маркировка: без ORD_OAUTH_TOKEN — ordfake, erid выдаётся через несколько секунд после
  # «maxim dev post-version --order N approve» (README, «Маркировка в разработке»).
  ORD_ENABLED: "true"
  ORD_OAUTH_TOKEN: ""
  ORD_PLATFORM_TYPE: site

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maxim
      POSTGRES_USER: maxim
      POSTGRES_PASSWORD: maxim
    ports: ["${DEV_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/dev/postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxim -d maxim"]
      interval: 2s
      retries: 30

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports: ["${DEV_MINIO_PORT:-9000}:9000", "${DEV_MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30

  # Корзины: закрытая (оригиналы, документы) и публичная (производные изображений из версий
  # поста, R-7). Публичная читается анонимно по ключу, перечисление объектов закрыто.
  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minio minio-secret
        mc mb --ignore-existing local/maxim-private local/maxim-public
        echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::maxim-public/*"]}]}' > /tmp/public-read.json
        mc anonymous set-json /tmp/public-read.json local/maxim-public

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ["${DEV_SMTP_PORT:-1025}:1025", "${DEV_MAILPIT_PORT:-8025}:8025"]

  migrate:
    build: { context: ., dockerfile: Dockerfile }
    image: maxim:dev
    command: ["migrate", "up"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://maxim:maxim@postgres:5432/maxim?sslmode=disable
      DB_APP_ROLE: maxim_app
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: maxim:dev
    command: ["api"]
    environment: *backend-env
    ports: ["${DEV_API_PORT:-8080}:8080", "${DEV_API_METRICS_PORT:-9090}:9090"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  worker:
    image: maxim:dev
    command: ["worker"]
    environment: *backend-env
    ports: ["${DEV_WORKER_METRICS_PORT:-9091}:9090"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

volumes:
  postgres: {}
  minio: {}
