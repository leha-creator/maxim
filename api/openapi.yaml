                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [balance]
      operationId: createInvoice
      summary: Выставить счёт на пополнение
      description: |
        Счёт действует 14 суток. Номер — `MX-` и шесть цифр; его нужно указать в назначении платежа.
        Не больше 10 счетов в час на пользователя и 30 на адрес. В тестовом сервере счёт можно
        «оплатить» через `POST /_mock/invoices/{id}/pay`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCreate' }
            example: { amount: 5000000 }
      responses:
        '201':
          description: Счёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invoices/{id}/pdf:
    get:
      tags: [balance]
      operationId: getInvoicePdf
      summary: Счёт в PDF
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /closing-acts:
    get:
      tags: [balance]
      operationId: listClosingActs
      summary: Закрывающие документы
      description: |
        Отчёт агента и акт на вознаграждение за месяц. Формируются 1-го числа за прошедший месяц
        для организаций, у которых в нём были распределены удержания.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Документы, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ClosingAct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /closing-acts/{id}/{document}:
    get:
      tags: [balance]
      operationId: getClosingActPdf
      summary: Отчёт агента или акт в PDF
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: document
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ClosingDocument' }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- blogger channels
  /blogger/channels:
    get:
      tags: [blogger-channels]
      operationId: listBloggerChannels
      summary: Каналы блогера
      responses:
        '200':
          description: Каналы
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /blogger/channels/link-code:
    post:
      tags: [blogger-channels]
      operationId: createChannelLinkCode
      summary: Код подключения канала (S-12)
      description: |
        Блогер добавляет бота платформы в канал администратором с правами на публикацию
        и удаление сообщений, затем отправляет этот код сообщением в канал; бот связывает
        канал с организацией и удаляет сообщение (A-41). Код из 8 символов действует 60 минут,
        регистр и пробелы по краям не важны. Новый код гасит прежний код организации.
        В тестовом сервере привязку выполняет `POST /_mock/channels/link`.
      responses:
        '201':
          description: Код
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelLinkCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /blogger/channels/{id}:
    get:
      tags: [blogger-channels]
      operationId: getBloggerChannel
      summary: Канал блогера
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [blogger-channels]
      operationId: updateBloggerChannel
      summary: Описание, категория, номер РКН
      description: |
        Канал из `pending_rights` или `rejected` после правки уходит на модерацию, если права бота в порядке.
        Канал в `unclaimed`, `disconnected` или `blocked` не правится — `409`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BloggerChannelUpdate' }
            example:
              description: Рецепты на каждый день
              category_id: '0190a000-0000-7000-8000-000000000201'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /blogger/channels/{id}/prices:
    put:
      tags: [blogger-channels]
      operationId: setBloggerChannelPrices
      summary: Цены по форматам (S-13)
      description: |
        Цена блогера без комиссии, от 100 до 10 000 000 ₽. Передаётся полный набор форматов:
        формат, которого нет в наборе, удаляется. Цена для рекламодателя `total_amount` —
        `amount + floor(amount × комиссия / 10000)`.

        Канал в `unclaimed`, `disconnected` или `blocked` цены не принимает — `409`.
        `422` с `details.reason`: `duplicate_format` — формат повторяется; `unknown_format` —
        формата нет среди активных; `active_requires_price` — у канала в `active` должна
        остаться хотя бы одна включённая цена.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelPricesInput' }
            example:
              prices:
                - { format_id: f_1_24, amount: 300000, is_enabled: true }
                - { format_id: f_2_48, amount: 450000, is_enabled: true }
                - { format_id: f_3_72, amount: 600000, is_enabled: false }
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /blogger/channels/{id}/unavailability:
    post:
      tags: [blogger-channels]
      operationId: addChannelUnavailability
      summary: Добавить интервал недоступности
      description: |
        Интервал, в который блогер не принимает публикации (S-13). Прошедшие интервалы в ответах
        не показываются. Канал в `unclaimed`, `disconnected` или `blocked` интервалы не принимает — `409`.
        `422` с `details.reason`: `in_past` — начало не раньше конца или конец уже прошёл;
        `too_long` — длиннее 90 суток; `too_far` — начало дальше 365 суток от текущего момента;
        `overlap` — пересекается с интервалом канала (соприкосновение границ — не пересечение);
        `too_many` — у канала уже 50 действующих интервалов.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnavailabilityInput' }
            example: { starts_at: '2026-10-28T00:00:00Z', ends_at: '2026-10-30T00:00:00Z' }
      responses:
        '201':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /blogger/channels/{id}/unavailability/{unavailabilityId}:
    delete:
      tags: [blogger-channels]
      operationId: deleteChannelUnavailability
      summary: Удалить интервал недоступности
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: unavailabilityId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- blogger placements
  /blogger/placements:
    get:
      tags: [blogger-placements]
      operationId: listBloggerPlacements
      summary: Запросы и размещения
      description: Блогер видит размещения, начиная с `awaiting_blogger` (после P-02).
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PlacementStatus' }
        - name: channel_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Размещения, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /blogger/placements/{id}:
    get:
      tags: [blogger-placements]
      operationId: getBloggerPlacement
      summary: Запрос на размещение
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Размещение с постом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blogger/placements/{id}/accept:
    post:
      tags: [blogger-placements]
      operationId: bloggerAcceptPlacement
      summary: Принять в работу (P-03)
      description: |
        Из `awaiting_blogger`. Для блогера не юрлица нужен активный исполнитель Рокет Ворк
        (иначе `409` с `details.reason = contractor_inactive`). Канал должен быть `active`
        (иначе `409` с `details.reason = channel_not_active`).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /blogger/placements/{id}/decline:
    post:
      tags: [blogger-placements]
      operationId: bloggerDeclinePlacement
      summary: Отказаться (P-04)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeclineInput' }
            example: { comment: Не подходит тематика }
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /blogger/placements/{id}/schedule:
    post:
      tags: [blogger-placements]
      operationId: bloggerSchedulePlacement
      summary: Запланировать или опубликовать сейчас (P-17)
      description: |
        Из `awaiting_schedule`. `mode=at` — время `publish_at` внутри периода дат и времени суток кампании,
        не раньше чем через 1 ч, кратно 5 минутам и не в интервале недоступности; `mode=now` — текущий момент,
        если он внутри периода. `remove_at = publish_at + duration_hours`. Интервал топа
        `[publish_at, publish_at + top_hours)` не пересекается с топом других размещений канала (стык допустим).
        `422` с `details.reason`: `publish_at_required`, `outside_window`, `outside_time`, `too_soon`,
        `not_aligned`, `channel_unavailable_interval`, `slot_taken`. Канал не `active` — `409` с
        `details.reason = channel_not_active`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
            example: { mode: at, publish_at: '2026-10-21T09:00:00Z' }
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /blogger/placements/{id}/reschedule:
    post:
      tags: [blogger-placements]
      operationId: bloggerReschedulePlacement
      summary: Перенести публикацию (P-07)
      description: |
        Из `scheduled`, если до прежнего `publish_at` больше 1 ч (иначе `409 invalid_transition`).
        Новое время проверяется по тем же правилам, что `mode=at` планирования; причины `422` — те же.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleInput' }
            example: { publish_at: '2026-10-22T09:00:00Z' }
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- blogger payouts
  /blogger/payouts:
    get:
      tags: [blogger-payouts]
      operationId: listBloggerPayouts
      summary: Выплаты блогеру
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Выплаты, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Payout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /blogger/rocketwork:
    get:
      tags: [blogger-payouts]
      operationId: getRocketworkStatus
      summary: Состояние исполнителя в Рокет Ворк
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RocketworkStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /blogger/rocketwork/invite:
    post:
      tags: [blogger-payouts]
      operationId: inviteRocketwork
      summary: Начать онбординг в Рокет Ворк (S-11)
      description: Возвращает ссылку на регистрацию исполнителя. Тестовый сервер сразу делает исполнителя `active`.
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RocketworkStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- admin: channels
  /admin/channels:
    get:
      tags: [admin-channels]
      operationId: listAdminChannels
      summary: Каналы для администратора (очередь модерации)
      description: |
        Каналы всех организаций, кроме `unclaimed`, по времени последнего изменения, старые первыми.
        `rkn_recheck_due = true` — номер РКН подтверждён больше 90 суток назад и его пора проверить снова
        (06 §6.3); канал при этом продолжает работать.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ChannelStatus' }
        - name: rkn_status
          in: query
          schema: { $ref: '#/components/schemas/RknStatus' }
        - name: rkn_recheck_due
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Каналы
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminChannelListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/channels/{id}:
    get:
      tags: [admin-channels]
      operationId: getAdminChannel
      summary: Канал для модерации (S-16 шаг 1)
      description: Сведения из MAX, метрики за 30 суток, флаги аномалий, история модерации.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/channels/{id}/approve:
    post:
      tags: [admin-channels]
      operationId: approveChannel
      summary: Одобрить канал (S-16 шаг 3)
      description: |
        Только из `moderation`. Нужны права бота и публичность канала, категория, включённая цена,
        а при подписчиках от 10 000 — подтверждённый номер РКН. Чего не хватает — `409` с
        `details.missing` из `rights`, `category`, `price`, `rkn`. Канал в другом состоянии — `409`
        с `details.status`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/channels/{id}/reject:
    post:
      tags: [admin-channels]
      operationId: rejectChannel
      summary: Отклонить канал (S-16)
      description: |
        Только из `moderation`. Канал переходит в `rejected`, текст причины виден блогеру в
        `status_reason`. После правки блогером канал снова уходит на модерацию.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelRejectInput' }
            example: { reason: В описании нет тематики канала }
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/channels/{id}/rkn-check:
    post:
      tags: [admin-channels]
      operationId: setChannelRknCheck
      summary: Результат проверки номера РКН (06 §6.3, Q-34)
      description: |
        Администратор вручную сверил номер с реестром. Канал в `unclaimed` или `disconnected`
        либо без номера — `409`. `confirmed` возвращает в `active` канал, приостановленный с
        причиной `rkn_required`; `rejected` оставляет такой канал приостановленным.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelRknCheckInput' }
            example: { result: confirmed }
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- webhooks
  /webhooks/max/{secret}:
    post:
      tags: [webhooks]
      operationId: maxWebhook
      summary: События MAX Bot API
      description: |
        Подлинность — секретная часть пути и секретный токен подписки в заголовке
        `X-Max-Bot-Api-Secret` (Q-35). Тело до 1 МБ. Событие сохраняется и разбирается
        заданием; ответ не зависит от результата разбора.
      security: []
      parameters:
        - name: secret
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
            example: { update_type: bot_added, timestamp: 1760000000000, chat_id: -70000000001 }
      responses:
        '200': { description: Событие принято }
        '401': { description: Проверка подлинности не пройдена }
        '413': { description: Тело больше 1 МБ }
  /webhooks/rocketwork:
    post:
      tags: [webhooks]
      operationId: rocketworkWebhook
      summary: События Рокет Ворк
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
            example: { event: payment.succeeded, id: rw-test-1 }
      responses:
        '200': { description: Событие принято }

  # ---------------------------------------------------------------- _mock
  /_mock/reset:
    post:
      tags: [_mock]
      operationId: mockReset
      summary: Вернуть начальные данные
      description: Сбрасывает все изменения и сдвиг часов. Сессии сохраняются.
      security: []
      responses:
        '204': { description: Сброшено }
  /_mock/clock:
    get:
      tags: [_mock]
      operationId: mockGetClock
      summary: Текущее время сервера
      security: []
      responses:
        '200':
          description: Время
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockClock' }
    post:
      tags: [_mock]
      operationId: mockShiftClock
      summary: Сдвинуть часы вперёд
      description: |
        Сдвигает подменяемые часы; после сдвига срабатывают просроченные таймеры:
        T-01 (P-05), T-13 (P-18), T-05 (P-13).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockClockShift' }
            example: { hours: 25 }
      responses:
        '200':
          description: Время после сдвига и выполненные переходы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockClock' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /_mock/orders/{id}/approve-post:
    post:
      tags: [_mock]
      operationId: mockApproveOrderPost
      summary: Одобрить пост и получить erid
      description: |
        Заменяет модерацию администратора (S-17) и регистрацию креатива в ОРД: текущая версия поста
        проходит `pending_moderation → approved → ready` с выдуманным erid, затем размещения
        из `created` переходят в `awaiting_blogger` (P-02).
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /_mock/orders/{id}/reject-post:
    post:
      tags: [_mock]
      operationId: mockRejectOrderPost
      summary: Отклонить пост
      description: Заменяет отклонение администратором (S-17). Размещения остаются в `created`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockRejectInput' }
            example: { reason: Нет пометки о рекламе на изображении }
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /_mock/placements/{id}/advance:
    post:
      tags: [_mock]
      operationId: mockAdvancePlacement
      summary: Выполнить системный переход
      description: |
        Заменяет планировщик и внешние системы:
        `P-08` — публикация (`scheduled → published`, часы сдвигаются на `publish_at`, если он в будущем);
        `P-10` — снятие (`published → removed`, часы сдвигаются на `remove_at`);
        `P-16` — выплата прошла (`accepted → paid`).
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockAdvanceInput' }
            example: { transition: P-08 }
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertiserPlacement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /_mock/invoices/{id}/pay:
    post:
      tags: [_mock]
      operationId: mockPayInvoice
      summary: Оплатить счёт
      description: Заменяет зачисление по выписке (S-30). Сумма счёта поступает на баланс.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Счёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /_mock/channels/link:
    post:
      tags: [_mock]
      operationId: mockLinkChannel
      summary: Подключить канал по коду
      description: |
        Заменяет сообщение с кодом подключения в канале (S-12): создаёт выдуманный канал MAX,
        привязывает его к организации кода и отправляет на модерацию; модерацию тестовый сервер
        проходит сразу — канал становится `active`, когда у него есть категория и цена.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockLinkChannelInput' }
            example: { code: K7M2Q9XA, title: Мой тестовый канал, subscribers_count: 4200 }
      responses:
        '201':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session

  headers:
    X-Request-Id:
      description: Сквозной идентификатор запроса
      schema: { type: string }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Limit:
      name: limit
      in: query
      description: Размер страницы
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Значение `next_cursor` из предыдущего ответа
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ключ идемпотентности действия (03 §11). Повтор с тем же ключом возвращает текущее состояние
        объекта без нового перехода. Без ключа повтор действия отклоняется `409 invalid_transition`
        с фактическим состоянием.
      schema: { type: string, minLength: 1, maxLength: 64 }

  responses:
    ValidationFailed:
      description: Запрос не прошёл проверку
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: validation_failed, message: request body is invalid, details: { field: email } }
            request_id: 0190a000-0000-7000-8000-00000000aaaa
    Unauthorized:
      description: Нет сессии или неверный код
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Нет нужного кабинета или не заполнены реквизиты
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Объекта нет или он чужой
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Действие невозможно в текущем состоянии данных
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidTransition:
      description: Переход недопустим из текущего состояния размещения
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: invalid_transition
              message: transition is not allowed from current status
              details: { transition: P-12, status: published }
            request_id: 0190a000-0000-7000-8000-00000000aaaa
    RateLimited:
      description: Превышен лимит частоты
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: rate_limited, message: too many requests, details: { scope: email } }
            request_id: 0190a000-0000-7000-8000-00000000aaaa
    NotImplemented:
      description: Операция описана, но бэкенд её ещё не реализует
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: not_implemented, message: operation is not implemented yet, details: { operation: getCart } }
            request_id: 0190a000-0000-7000-8000-00000000aaaa

  schemas:
    # ------------------------------------------------ common
    Uuid:
      type: string
      format: uuid
      example: 0190a000-0000-7000-8000-000000000101
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Сумма в копейках
      example: 345000
    SignedMoney:
      type: integer
      format: int64
      description: Сумма в копейках со знаком
      example: -345000
    TimeOfDay:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Время суток по Москве
      example: '10:00'
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - invalid_transition
        - insufficient_balance
        - cart_changed
        - campaign_incomplete
        - inn_taken
        - rate_limited
        - not_implemented
        - internal
    Error:
      type: object
      required: [error, request_id]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
        request_id: { type: string }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: Короткое описание на английском }
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      properties:
        next_cursor:
          type: string
          description: Нет — это последняя страница

    # ------------------------------------------------ enums (04 §9)
    LegalType:
      type: string
      enum: [legal_entity, sole_proprietor, self_employed]
    TaxRegime:
      type: string
      enum: [osno, usn, ausn, eshn, psn, npd]
    VatRate:
      type: string
      enum: [none, vat_5, vat_7, vat_22]
    Cabinet:
      type: string
      enum: [advertiser, blogger]
    ChannelStatus:
      type: string
      enum: [unclaimed, pending_rights, moderation, active, rejected, suspended, disconnected, blocked]
    RknStatus:
      type: string
      enum: [not_required, pending, confirmed, rejected]
    PlacementFormatId:
      type: string
      description: Идентификатор формата из справочника (03 §2)
      example: f_1_24
    CampaignStatus:
      type: string
      enum: [draft, ordered, archived]
    PostVersionStatus:
      type: string
      enum: [pending_moderation, rejected, approved, ready]
    OrderStatus:
      type: string
      enum: [moderation, rejected, marking, in_progress, completed, cancelled]
    PlacementStatus:
      type: string
      enum:
        - created
        - awaiting_blogger
        - awaiting_schedule
        - scheduled
        - published
        - removed
        - disputed
        - accepted
        - paid
        - declined
        - expired
        - cancelled
        - failed
        - refunded
    TokenCarrier:
      type: string
      enum: [text, media]
      description: Где пометка «Реклама» с названием и ИНН
    TokenPosition:
      type: string
      enum: [link, above, below]
      description: Где erid
    ClaimReason:
      type: string
      enum: [removed_early, top_violated, content_mismatch, other]
    InvoiceStatus:
      type: string
      enum: [issued, paid, expired, cancelled]
    PayoutStatus:
      type: string
      enum: [created, sent, succeeded, failed]
    RocketworkContractorStatus:
      type: string
      enum: [none, invited, pending, active, blocked]
      description: '`none` — онбординг не начат'
    AdvertiserPlacementAction:
      type: string
      enum: [cancel, accept, claim]
    BloggerPlacementAction:
      type: string
      enum: [accept, decline, schedule, reschedule]

    # ------------------------------------------------ auth
    LoginCodeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    LoginCodeResponse:
      type: object
      required: [expires_in_seconds]
      properties:
        expires_in_seconds: { type: integer, example: 600 }
    LoginRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    Me:
      type: object
      required: [user, organizations, pending_legal_document_ids]
      properties:
        user: { $ref: '#/components/schemas/User' }
        organizations:
          type: array
          description: В первой версии — не больше одной
          items: { $ref: '#/components/schemas/OrganizationBrief' }
        pending_legal_document_ids:
          type: array
          description: Документы, которые нужно принять для работы в открытых кабинетах
          items: { $ref: '#/components/schemas/Uuid' }
    User:
      type: object
      required: [id, email]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        last_login_at: { type: string, format: date-time }

    # ------------------------------------------------ organizations
    OrganizationBrief:
      type: object
      required: [id, name, inn, legal_type, cabinets]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        inn: { type: string }
        legal_type: { $ref: '#/components/schemas/LegalType' }
        cabinets:
          type: array
          items: { $ref: '#/components/schemas/Cabinet' }
    OrganizationFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 500, description: Наименование или ФИО }
        contact_name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, pattern: '^\+7[0-9]{10}$' }
        kpp: { type: string, pattern: '^[0-9]{9}$', description: Только для `legal_entity` }
        address: { type: string, maxLength: 500 }
        tax_regime: { $ref: '#/components/schemas/TaxRegime' }
        vat_rate: { $ref: '#/components/schemas/VatRate' }
        signer_position: { type: string, maxLength: 200 }
        signer_name: { type: string, maxLength: 200 }
        signer_basis_name: { type: string, maxLength: 200 }
        signer_basis_number: { type: string, maxLength: 100 }
        bank_account: { type: string, pattern: '^[0-9]{20}$' }
        bank_name: { type: string, maxLength: 300 }
        bank_corr_account: { type: string, pattern: '^[0-9]{20}$' }
        bank_bik: { type: string, pattern: '^[0-9]{9}$' }
        blogger_full_name: { type: string, maxLength: 200, description: ФИО блогера для выплат }
    OrganizationCreate:
      allOf:
        - $ref: '#/components/schemas/OrganizationFields'
        - type: object
          required: [cabinet, legal_type, inn, name, contact_name, phone]
          properties:
            cabinet: { $ref: '#/components/schemas/Cabinet' }
            legal_type: { $ref: '#/components/schemas/LegalType' }
            inn: { type: string, pattern: '^([0-9]{10}|[0-9]{12})$', description: '10 цифр у юрлица, 12 у остальных' }
    OrganizationUpdate:
      $ref: '#/components/schemas/OrganizationFields'
    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationFields'
        - type: object
          required: [id, legal_type, inn, name, contact_name, phone, status, cabinets, tax_document_uploaded, created_at]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            legal_type: { $ref: '#/components/schemas/LegalType' }
            inn: { type: string }
            status: { type: string, enum: [active, blocked] }
            cabinets:
              type: array
              items: { $ref: '#/components/schemas/Cabinet' }
            tax_document_uploaded:
              type: boolean
              description: Документ о режиме налогообложения загружен (нужен блогеру)
            created_at: { type: string, format: date-time }

    # ------------------------------------------------ legal, notifications
    LegalDocument:
      type: object
      required: [id, kind, version, published_at, title, url, accepted]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [advertiser_offer, blogger_offer, platform_rules, privacy_policy] }
        version: { type: integer, example: 1, description: Номер версии внутри вида; действующая — наибольшая }
        published_at: { type: string, format: date-time }
        title: { type: string }
        url: { type: string, format: uri, description: Кратковременная подписанная ссылка на файл }
        accepted: { type: boolean, description: Принят текущей организацией }
    LegalAcceptanceRequest:
      type: object
      required: [legal_document_ids]
      properties:
        legal_document_ids:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Uuid' }
    Notification:
      type: object
      required: [id, template, title, text, created_at, is_read]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        template: { type: string, example: placement.awaiting_blogger }
        title: { type: string }
        text: { type: string }
        object_type: { type: string, example: placement }
        object_id: { $ref: '#/components/schemas/Uuid' }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------ catalog
    ChannelCategory:
      type: object
      required: [id, slug, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string, example: food }
        name: { type: string, example: Еда и кулинария }
    PlacementFormat:
      type: object
      required: [id, name, top_hours, duration_hours]
      properties:
        id: { $ref: '#/components/schemas/PlacementFormatId' }
        name: { type: string, example: 1/24 }
        top_hours: { type: integer, description: Сколько часов пост должен быть последним в канале }
        duration_hours: { type: integer, description: Через сколько часов пост снимается }
    CatalogPrice:
      type: object
      required: [format_id, total_amount]
      properties:
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
        total_amount: { $ref: '#/components/schemas/Money' }
    ChannelRef:
      type: object
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        icon_url: { type: string, format: uri }
        link: { type: string, format: uri }
    CatalogChannel:
      type: object
      required: [id, title, link, category, subscribers_count, rating, prices]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        icon_url: { type: string, format: uri }
        link: { type: string, format: uri }
        description: { type: string }
        category: { $ref: '#/components/schemas/ChannelCategory' }
        subscribers_count: { type: integer }
        avg_views: { type: integer }
        engagement_bp: { type: integer, description: Вовлечённость в базисных пунктах }
        rating: { type: integer, minimum: 0, maximum: 100 }
        rkn_number: { type: string }
        anomaly_flags:
          type: array
          items: { type: string, enum: [subscribers_spike, views_disproportion] }
        prices:
          type: array
          description: Только включённые форматы
          items: { $ref: '#/components/schemas/CatalogPrice' }
        cpv:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            Цена за просмотр: цена формата `format_id` (без него — минимальная включённая) / `avg_views`,
            в копейках с округлением вниз. Нет `avg_views` — поля нет
        in_cart: { type: boolean }
    CatalogChannelDetail:
      allOf:
        - $ref: '#/components/schemas/CatalogChannel'
        - type: object
          required: [metrics_history, unavailability]
          properties:
            max_description: { type: string }
            posts_per_week: { type: number, format: double }
            metrics_history:
              type: array
              description: Суточные снимки за 30 дней
              items: { $ref: '#/components/schemas/ChannelMetricsPoint' }
            unavailability:
              type: array
              items: { $ref: '#/components/schemas/Unavailability' }
    ChannelMetricsPoint:
      type: object
      required: [date, subscribers_count]
      properties:
        date: { type: string, format: date }
        subscribers_count: { type: integer }
        avg_views: { type: integer }

    # ------------------------------------------------ cart
    CartItemCreate:
      type: object
      required: [channel_id, format_id]
      properties:
        channel_id: { $ref: '#/components/schemas/Uuid' }
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
    CartItemUpdate:
      type: object
      required: [format_id]
      properties:
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
    CartItem:
      type: object
      required: [id, channel, format_id, shown_total_amount, price_changed, available]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        channel: { $ref: '#/components/schemas/ChannelRef' }
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
        shown_total_amount: { $ref: '#/components/schemas/Money' }
        current_total_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Нет, если формат канала выключен
        price_changed: { type: boolean }
        available: { type: boolean, description: Канал `active` и формат включён }
    Cart:
      type: object
      required: [items, total_amount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        total_amount: { $ref: '#/components/schemas/Money' }

    # ------------------------------------------------ campaigns and posts
    CampaignInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        time_from: { $ref: '#/components/schemas/TimeOfDay' }
        time_to: { $ref: '#/components/schemas/TimeOfDay' }
        extra_requirements: { type: string, maxLength: 2000 }
    Campaign:
      type: object
      required: [id, name, status, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        time_from: { $ref: '#/components/schemas/TimeOfDay' }
        time_to: { $ref: '#/components/schemas/TimeOfDay' }
        extra_requirements: { type: string }
        order_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EditorDoc:
      type: object
      description: Документ редактора; схема равна набору форматирования MAX (05 §2.5)
      required: [type, content]
      properties:
        type: { type: string, enum: [doc] }
        content:
          type: array
          items: { $ref: '#/components/schemas/EditorBlock' }
    EditorBlock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [paragraph, heading, blockquote] }
        content:
          type: array
          items: { $ref: '#/components/schemas/EditorText' }
    EditorText:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [text] }
        text: { type: string }
        marks:
          type: array
          items: { $ref: '#/components/schemas/EditorMark' }
    EditorMark:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [bold, italic, underline, strike, code, link, highlight] }
        href: { type: string, pattern: '^https://', description: Только для `link` }
    PostDraftInput:
      type: object
      required: [content_doc, media_file_ids]
      properties:
        content_doc: { $ref: '#/components/schemas/EditorDoc' }
        media_file_ids:
          type: array
          maxItems: 10
          description: Изображения альбома по порядку
          items: { $ref: '#/components/schemas/Uuid' }
        token_carrier: { $ref: '#/components/schemas/TokenCarrier' }
        token_position: { $ref: '#/components/schemas/TokenPosition' }
    PostDraft:
      type: object
      required: [campaign_id, content_doc, media, token_carrier, token_position, updated_at]
      properties:
        campaign_id: { $ref: '#/components/schemas/Uuid' }
        content_doc: { $ref: '#/components/schemas/EditorDoc' }
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaFile' }
        token_carrier: { $ref: '#/components/schemas/TokenCarrier' }
        token_position: { $ref: '#/components/schemas/TokenPosition' }
        updated_at: { type: string, format: date-time }
    PostPreview:
      type: object
      required: [body, body_length, body_limit, final_text_sample, media_urls, problems]
      properties:
        body: { type: string, description: Текст в формате API MAX без строки маркировки }
        body_length: { type: integer }
        body_limit: { type: integer, example: 3800 }
        final_text_sample: { type: string, description: Итоговый текст с условным erid }
        media_urls:
          type: array
          description: |
            Изображения в том виде, в каком уйдут в канал (с плашкой при `token_carrier=media`).
            Подписанные ссылки со сроком действия; изображения, которые ещё строятся, не входят.
          items: { type: string, format: uri }
        problems:
          type: array
          description: Нарушения автоматических проверок; пусто — пост можно оплачивать
          items: { $ref: '#/components/schemas/PostProblem' }
    PostProblem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            - `empty_text` — в посте нет текста;
            - `body_too_long` — текст с разметкой и UTM-метками длиннее 3800 знаков;
            - `too_many_media` — изображений больше предела альбома;
            - `link_not_https` — ссылка не `https://`;
            - `media_required_for_token` — `token_carrier = media`, а изображений нет;
            - `link_required_for_token` — `token_position = link`, а ссылок нет;
            - `media_processing` — изображения с плашкой или их копии ещё строятся;
            - `requisites_missing` — у организации нет названия или ИНН.
          enum:
            - empty_text
            - body_too_long
            - too_many_media
            - link_not_https
            - media_required_for_token
            - link_required_for_token
            - media_processing
            - requisites_missing
        message: { type: string }
    PostVersion:
      type: object
      required: [id, number, status, token_carrier, token_position, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: integer }
        status: { $ref: '#/components/schemas/PostVersionStatus' }
        body: { type: string }
        final_text: { type: string, description: Есть с состояния `ready` }
        erid: { type: string, description: Есть с состояния `ready` }
        media_urls:
          type: array
          items: { type: string, format: uri }
        token_carrier: { $ref: '#/components/schemas/TokenCarrier' }
        token_position: { $ref: '#/components/schemas/TokenPosition' }
        rejection_reason: { type: string }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------ media
    MediaFile:
      type: object
      required: [id, original_name, mime, size_bytes, width, height, preview_url, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        original_name: { type: string }
        mime: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size_bytes: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        preview_url:
          type: string
          format: uri
          description: |
            Подписанная ссылка со сроком действия на уменьшенную копию. Пока копия строится,
            ссылка ведёт на оригинал.
        created_at: { type: string, format: date-time }

    # ------------------------------------------------ orders and placements
    OrderSummary:
      type: object
      required: [id, number, campaign_id, campaign_name, status, total_amount, placements_count, placements_by_status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: integer, format: int64 }
        campaign_id: { $ref: '#/components/schemas/Uuid' }
        campaign_name: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total_amount: { $ref: '#/components/schemas/Money' }
        placements_count: { type: integer }
        placements_by_status:
          type: object
          description: Число размещений по состояниям
          additionalProperties: { type: integer }
        created_at: { type: string, format: date-time }
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [current_post_version, placements]
          properties:
            current_post_version: { $ref: '#/components/schemas/PostVersion' }
            placements:
              type: array
              items: { $ref: '#/components/schemas/AdvertiserPlacement' }
    PlacementTiming:
      type: object
      required: [format_id, top_hours, duration_hours, window_start, window_end, time_from, time_to]
      properties:
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
        top_hours: { type: integer }
        duration_hours: { type: integer }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        time_from: { $ref: '#/components/schemas/TimeOfDay' }
        time_to: { $ref: '#/components/schemas/TimeOfDay' }
        accept_deadline_at: { type: string, format: date-time, description: T-01 }
        schedule_deadline_at: { type: string, format: date-time, description: T-13 }
        publish_at: { type: string, format: date-time }
        remove_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        removed_at: { type: string, format: date-time }
        claim_deadline_at: { type: string, format: date-time, description: T-05 }
    AdvertiserPlacement:
      allOf:
        - $ref: '#/components/schemas/PlacementTiming'
        - type: object
          required: [id, order_id, channel, status, status_changed_at, total_amount, history, available_actions]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            order_id: { $ref: '#/components/schemas/Uuid' }
            channel: { $ref: '#/components/schemas/ChannelRef' }
            status: { $ref: '#/components/schemas/PlacementStatus' }
            status_reason: { type: string }
            status_changed_at: { type: string, format: date-time }
            total_amount: { $ref: '#/components/schemas/Money' }
            refund_amount: { $ref: '#/components/schemas/Money' }
            performance_share: { type: integer, minimum: 0, maximum: 10000 }
            publication_url: { type: string, format: uri, description: Публичная ссылка на пост в MAX }
            views:
              type: integer
              description: Просмотры поста — последнее считанное значение; после снятия — итоговое
            claim: { $ref: '#/components/schemas/PlacementClaim' }
            dispute: { $ref: '#/components/schemas/PlacementDisputeSummary' }
            history:
              type: array
              items: { $ref: '#/components/schemas/PlacementHistoryEntry' }
            available_actions:
              type: array
              description: |
                Действия, допустимые сейчас: `cancel` — из `created` и `awaiting_blogger`.
                `accept` и `claim` появятся с этапом приёмки.
              items: { $ref: '#/components/schemas/AdvertiserPlacementAction' }
    PlacementClaim:
      type: object
      required: [reason, text, created_at]
      properties:
        reason: { $ref: '#/components/schemas/ClaimReason' }
        text: { type: string }
        created_at: { type: string, format: date-time }
    PlacementDisputeSummary:
      type: object
      description: |
        Спор по размещению (03 §6): открыт рекламодателем, системой при нарушении или администратором.
        Решение принимает администратор; предложение доли в кабинетах не показывается.
      required: [reason, opened_by_type, opened_at, deadline_at]
      properties:
        reason:
          type: string
          enum: [removed_early, content_modified, top_violated, bot_access_lost, content_mismatch, other, admin]
        opened_by_type: { type: string, enum: [advertiser, system, admin] }
        opened_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time, description: T-06 }
    PlacementHistoryEntry:
      type: object
      required: [transition, to_status, actor_type, created_at]
      properties:
        transition: { type: string, example: P-03 }
        from_status: { $ref: '#/components/schemas/PlacementStatus' }
        to_status: { $ref: '#/components/schemas/PlacementStatus' }
        actor_type: { type: string, enum: [advertiser, blogger, admin, system] }
        reason_code: { type: string }
        created_at: { type: string, format: date-time }
    ClaimCreate:
      type: object
      required: [reason, text]
      properties:
        reason: { $ref: '#/components/schemas/ClaimReason' }
        text: { type: string, minLength: 1, maxLength: 2000 }
    OrderReport:
      type: object
      required: [order_id, order_number, campaign_name, totals, rows]
      properties:
        order_id: { $ref: '#/components/schemas/Uuid' }
        order_number: { type: integer, format: int64 }
        campaign_name: { type: string }
        totals: { $ref: '#/components/schemas/OrderReportTotals' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/OrderReportRow' }
    OrderReportTotals:
      type: object
      required: [placements, published, views, spent_amount, refunded_amount]
      properties:
        placements: { type: integer }
        published: { type: integer, description: 'Размещения, которые выходили в канал' }
        views: { type: integer }
        spent_amount: { $ref: '#/components/schemas/Money' }
        refunded_amount: { $ref: '#/components/schemas/Money' }
    OrderReportRow:
      type: object
      required: [placement_id, channel, status]
      properties:
        placement_id: { $ref: '#/components/schemas/Uuid' }
        channel: { $ref: '#/components/schemas/ChannelRef' }
        status: { $ref: '#/components/schemas/PlacementStatus' }
        published_at: { type: string, format: date-time }
        removed_at: { type: string, format: date-time }
        views: { type: integer }
        publication_url: { type: string, format: uri }
        utm_campaign: { type: string, example: order_1001 }

    # ------------------------------------------------ balance
    Balance:
      type: object
      required: [available_amount, held_amount]
      properties:
        available_amount: { $ref: '#/components/schemas/Money' }
        held_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Удержано по активным размещениям
    BalanceTransaction:
      type: object
      required: [id, kind, amount, created_at, description]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [deposit, hold, hold_release, refund, balance_return, manual], description: Вид операции с точки зрения рекламодателя }
        amount: { $ref: '#/components/schemas/SignedMoney' }
        description: { type: string }
        order_id: { $ref: '#/components/schemas/Uuid' }
        placement_id: { $ref: '#/components/schemas/Uuid' }
        invoice_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { type: string, format: date-time }
    InvoiceCreate:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 100000
          maximum: 100000000000
          description: Сумма пополнения в копейках, от 1 000 ₽
    Invoice:
      type: object
      required: [id, number, amount, status, expires_at, created_at, pdf_url]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: string, example: MX-000101 }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }
        paid_amount: { $ref: '#/components/schemas/Money' }
        pdf_url: { type: string, description: Относительный адрес PDF }
        created_at: { type: string, format: date-time }
    ClosingDocument:
      type: string
      enum: [report, act]
      description: report — отчёт агента, act — акт на вознаграждение
    ClosingAct:
      type: object
      required: [id, number, period, placements_amount, fee_amount, report_url, act_url, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: string, example: А-000001 }
        period: { type: string, pattern: '^\d{4}-\d{2}$', example: 2026-10, description: Месяц по Москве }
        placements_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Выплачено блогерам по размещениям месяца
        fee_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Вознаграждение платформы
        report_url: { type: string, description: Относительный адрес PDF отчёта агента }
        act_url: { type: string, description: Относительный адрес PDF акта }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------ blogger
    Unavailability:
      type: object
      required: [id, starts_at, ends_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    UnavailabilityInput:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    BloggerPrice:
      type: object
      required: [format_id, amount, is_enabled, total_amount]
      properties:
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Цена блогера без комиссии
        is_enabled: { type: boolean }
        total_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Цена для рекламодателя, с комиссией платформы
    BloggerChannel:
      type: object
      required: [id, title, is_public, status, subscribers_count, bot_is_admin, bot_permissions, missing_permissions, rkn_status, rating, prices, unavailability]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        icon_url: { type: string, format: uri }
        link: { type: string, format: uri }
        is_public: { type: boolean }
        status: { $ref: '#/components/schemas/ChannelStatus' }
        status_reason:
          type: string
          description: |
            Код причины состояния: `not_public` — канал закрытый; `missing_rights` — у бота нет
            прав из `missing_permissions`; `unclaimed_expired` — канал не подключён кодом за 7 суток;
            текст отказа модерации для `rejected`.
        description: { type: string }
        category_id: { $ref: '#/components/schemas/Uuid' }
        subscribers_count: { type: integer }
        bot_is_admin: { type: boolean }
        bot_permissions:
          type: array
          items: { type: string }
        missing_permissions:
          type: array
          description: Обязательные права бота (`write`, `delete`), которых нет (A-01)
          items: { type: string }
        rkn_number: { type: string }
        rkn_status: { $ref: '#/components/schemas/RknStatus' }
        rating: { type: integer, minimum: 0, maximum: 100 }
        prices:
          type: array
          items: { $ref: '#/components/schemas/BloggerPrice' }
        unavailability:
          type: array
          items: { $ref: '#/components/schemas/Unavailability' }
    BloggerChannelUpdate:
      type: object
      properties:
        description: { type: string, maxLength: 2000 }
        category_id: { $ref: '#/components/schemas/Uuid' }
        rkn_number: { type: string, maxLength: 50 }
    ChannelPricesInput:
      type: object
      required: [prices]
      properties:
        prices:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ChannelPriceInput' }
    ChannelPriceInput:
      type: object
      required: [format_id, amount, is_enabled]
      properties:
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
        amount: { type: integer, format: int64, minimum: 10000, maximum: 1000000000 }
        is_enabled: { type: boolean }
    ChannelLinkCode:
      type: object
      required: [code, expires_at, bot_name, instruction]
      properties:
        code: { type: string, pattern: '^[2-9A-HJ-NP-Z]{8}$', example: K7M2Q9XA }
        expires_at: { type: string, format: date-time }
        bot_name: { type: string, example: '@test_ads_bot' }
        instruction: { type: string }
    BloggerPost:
      type: object
      description: Пост размещения. Есть, пока версия поста размещения в `ready` и размещение не в `created`
      required: [final_text, media_urls, erid]
      properties:
        final_text: { type: string }
        media_urls:
          type: array
          items: { type: string, format: uri }
        erid: { type: string }
        extra_requirements: { type: string }
    BloggerPlacement:
      allOf:
        - $ref: '#/components/schemas/PlacementTiming'
        - type: object
          required: [id, order_number, channel, status, status_changed_at, blogger_amount, available_actions]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            order_number: { type: integer, format: int64 }
            advertiser_name: { type: string }
            channel: { $ref: '#/components/schemas/ChannelRef' }
            status: { $ref: '#/components/schemas/PlacementStatus' }
            status_reason: { type: string }
            status_changed_at: { type: string, format: date-time }
            blogger_amount:
              allOf: [{ $ref: '#/components/schemas/Money' }]
              description: Сумма блогеру без комиссии платформы
            payout_amount: { $ref: '#/components/schemas/Money' }
            publication_url: { type: string, format: uri, description: Публичная ссылка на пост в MAX }
            views:
              type: integer
              description: Просмотры поста — последнее считанное значение; после снятия — итоговое
            dispute: { $ref: '#/components/schemas/PlacementDisputeSummary' }
            post: { $ref: '#/components/schemas/BloggerPost' }
            available_actions:
              type: array
              description: |
                `accept`, `decline` — из `awaiting_blogger`; `schedule` — из `awaiting_schedule`;
                `reschedule` — из `scheduled`, пока до `publish_at` больше 1 ч
              items: { $ref: '#/components/schemas/BloggerPlacementAction' }
    DeclineInput:
      type: object
      properties:
        comment: { type: string, maxLength: 1000 }
    ScheduleInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [at, now] }
        publish_at: { type: string, format: date-time, description: Обязательно при `mode=at` }
    RescheduleInput:
      type: object
      required: [publish_at]
      properties:
        publish_at: { type: string, format: date-time }
    Payout:
      type: object
      required: [id, placement_id, order_number, channel, amount, status, attempt, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        placement_id: { $ref: '#/components/schemas/Uuid' }
        order_number: { type: integer, format: int64 }
        channel: { $ref: '#/components/schemas/ChannelRef' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        attempt: { type: integer }
        receipt_url: { type: string, format: uri }
        failure_message: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    RocketworkStatus:
      type: object
      required: [status, required]
      properties:
        status: { $ref: '#/components/schemas/RocketworkContractorStatus' }
        required: { type: boolean, description: Нужен ли Рокет Ворк (не нужен юрлицу) }
        onboarding_url: { type: string, format: uri }

    # ------------------------------------------------ admin: channels
    AdminOrganizationRef:
      type: object
      required: [id, name, inn]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        inn: { type: string, description: 'ИНН с маской: видны первые 2 и последние 4 цифры (07 §5.4)', example: '77****1234' }
    AdminChannelListItem:
      type: object
      required: [id, title, status, subscribers_count, rkn_status, rkn_recheck_due, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        link: { type: string, format: uri }
        organization: { $ref: '#/components/schemas/AdminOrganizationRef' }
        status: { $ref: '#/components/schemas/ChannelStatus' }
        status_reason: { type: string }
        category_id: { $ref: '#/components/schemas/Uuid' }
        subscribers_count: { type: integer }
        rkn_number: { type: string }
        rkn_status: { $ref: '#/components/schemas/RknStatus' }
        rkn_recheck_due: { type: boolean }
        updated_at: { type: string, format: date-time }
    AdminChannel:
      allOf:
        - $ref: '#/components/schemas/BloggerChannel'
        - type: object
          required: [rkn_recheck_due, metrics_history, moderation_history]
          properties:
            organization: { $ref: '#/components/schemas/AdminOrganizationRef' }
            max_description: { type: string }
            avg_views: { type: integer }
            engagement_bp: { type: integer }
            posts_per_week: { type: number, format: double }
            anomaly_flags:
              type: array
              items: { type: string, enum: [subscribers_spike, views_disproportion] }
            metrics_history:
              type: array
              description: Последние 30 суточных снимков, старые первыми
              items: { $ref: '#/components/schemas/ChannelMetricsPoint' }
            rkn_checked_at: { type: string, format: date-time }
            rkn_recheck_due: { type: boolean }
            moderated_at: { type: string, format: date-time }
            moderation_history:
              type: array
              description: Решения модерации и проверки РКН, старые первыми
              items: { $ref: '#/components/schemas/ChannelModerationEntry' }
    ChannelModerationEntry:
      type: object
      required: [action, actor_type, created_at]
      properties:
        action:
          type: string
          enum: [approved, rejected, rkn_checked]
        actor_type: { type: string, enum: [admin, system] }
        actor_user_id: { $ref: '#/components/schemas/Uuid' }
        result: { type: string, enum: [confirmed, rejected], description: Для `rkn_checked` }
        comment: { type: string, description: Причина отказа или комментарий проверки }
        created_at: { type: string, format: date-time }
    ChannelRejectInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ChannelRknCheckInput:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [confirmed, rejected] }
        comment: { type: string, maxLength: 500 }

    # ------------------------------------------------ webhooks, mock
    WebhookPayload:
      type: object
      additionalProperties: true
    MockClock:
      type: object
      required: [now, offset_hours, transitions]
      properties:
        now: { type: string, format: date-time }
        offset_hours: { type: number, format: double }
        transitions:
          type: array
          description: Переходы, выполненные таймерами при сдвиге
          items: { $ref: '#/components/schemas/MockTransition' }
    MockTransition:
      type: object
      required: [placement_id, transition, to_status]
      properties:
        placement_id: { $ref: '#/components/schemas/Uuid' }
        transition: { type: string }
        to_status: { $ref: '#/components/schemas/PlacementStatus' }
    MockClockShift:
      type: object
      required: [hours]
      properties:
        hours: { type: number, format: double, minimum: 0, maximum: 2000 }
    MockRejectInput:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }
    MockAdvanceInput:
      type: object
      required: [transition]
      properties:
        transition: { type: string, enum: [P-08, P-10, P-16] }
    MockLinkChannelInput:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[2-9A-HJ-NP-Z]{8}$', example: K7M2Q9XA }
        title: { type: string, maxLength: 200 }
        subscribers_count: { type: integer, minimum: 0, maximum: 100000000 }
