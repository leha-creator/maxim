openapi: 3.0.3
info:
  title: Кабинеты биржи рекламы в каналах MAX
  version: 0.1.0-draft
  description: |
    HTTP API кабинетов рекламодателя и блогера. Черновик: составлен по документам
    `docs/02-scenarios.md`, `docs/03-placement.md`, `docs/04-domain-model.md`, `docs/08-screens.md`.
    При расхождении правы документы. Из раздела администратора описаны операции для каналов
    (тег `admin-channels`, этап «Каталог»); остальные операции администратора — этап «API администратора».

    Соглашения:
    - Деньги — целые копейки (`int64`). Суммы считает сервер; клиент передаёт идентификаторы.
    - Время — RFC 3339 в UTC. Время суток (`time_from`, `time_to`) — `ЧЧ:ММ` по Москве.
    - Идентификаторы — UUID; у формата размещения — строка (`f_1_24`).
    - Сессия — cookie `session` (`HttpOnly`, `Secure`, `SameSite=Lax`), выдаётся при входе.
    - Защита от межсайтовой подделки — двойная отправка: при входе выдаётся cookie `csrf_token`
      (без `HttpOnly`); меняющие запросы (`POST`, `PUT`, `PATCH`, `DELETE`), кроме `/auth/code`
      и `/auth/login`, повторяют её значение в заголовке `X-CSRF-Token`. Без совпадения — `403`
      с `details.reason = csrf` (тестовый сервер заголовок не проверяет).
    - Превышение лимита частоты — `429` с кодом `rate_limited` и заголовком `Retry-After` в секундах.
    - Операция, которую бэкенд ещё не реализует, отвечает `501` с кодом `not_implemented`.
    - Переход размещения, недопустимый из текущего состояния, отклоняется ответом `409` с кодом `invalid_transition`.
    - Каждый ответ содержит заголовок `X-Request-Id`; по нему запрос находится в журнале.

    Операции с тегом `_mock` есть только в тестовом сервере.
servers:
  - url: /api/v1
    description: Тот же адрес, с которого открыта документация
security:
  - session: []
tags:
  - name: auth
    description: Вход по почте с одноразовым кодом (S-01, S-10; экран `auth/login`)
  - name: organizations
    description: Реквизиты организации (S-01, S-10; `auth/org-adv`, `auth/org-blg`, `adv/profile`, `blg/profile`)
  - name: legal
    description: Оферты и правила, их принятие
  - name: notifications
    description: Уведомления в кабинете (`common/notifications`)
  - name: catalog
    description: Каталог каналов (S-02; `adv/catalog`, `adv/channel`)
  - name: cart
    description: Корзина (S-03; `adv/cart`)
  - name: campaigns
    description: Кампании и единый пост (S-04, S-05, S-06; `adv/campaigns`, `adv/campaign-new`, `adv/campaign-post`)
  - name: media
    description: Медиатека (`adv/media`)
  - name: orders
    description: Заказы и размещения рекламодателя (S-07, S-08, S-09, S-29; `adv/orders`, `adv/order`, `adv/report`)
  - name: balance
    description: Баланс и счета (S-06, S-33; `adv/balance`)
  - name: blogger-channels
    description: Каналы блогера (S-12, S-13; `blg/channels`, `blg/channel-add`, `blg/channel`)
  - name: blogger-placements
    description: Запросы и размещения блогера (S-14; `blg/placements`, `blg/placement`)
  - name: blogger-payouts
    description: Выплаты и Рокет Ворк (S-11, S-15; `blg/payouts`)
  - name: admin-channels
    description: |
      Модерация каналов и проверка номера РКН администратором (S-16, 06 §6.3). Нужна роль
      администратора `moderator` или `senior` (07 §4), иначе `403` с `details.reason = admin_required`.
      Тестовый сервер эти операции не реализует (`501`).
  - name: webhooks
    description: Входящие события внешних систем. Тестовый сервер принимает и ничего не делает
  - name: _mock
    description: Управление тестовым сервером. Только в тестовом сервере

paths:
  # ---------------------------------------------------------------- auth
  /auth/code:
    post:
      tags: [auth]
      operationId: requestLoginCode
      summary: Запросить код входа
      description: |
        Отправляет 6-значный код на почту. Ответ одинаков для существующего и нового адреса.
        В тестовом сервере письмо не отправляется, код всегда `000000`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCodeRequest' }
            example: { email: adv@example.test }
      responses:
        '202':
          description: Код отправлен
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginCodeResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Войти по коду
      description: |
        Проверяет код и выдаёт cookie сессии. Если пользователя нет — создаёт его;
        тогда `organizations` пуст и кабинет ведёт на заполнение реквизитов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: adv@example.test, code: '000000' }
      responses:
        '200':
          description: Вход выполнен
          headers:
            Set-Cookie:
              description: Cookie `session` и `csrf_token`
              schema: { type: string }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выйти
      responses:
        '204':
          description: Сессия закрыта
          headers:
            Set-Cookie:
              description: Очищенные cookie `session` и `csrf_token`
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Текущий пользователь и его организации
      responses:
        '200':
          description: Пользователь
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- organizations
  /organizations:
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Заполнить реквизиты и открыть кабинет
      description: |
        Создаёт организацию пользователя с профилем рекламодателя или блогера. Если организация
        уже есть — добавляет к ней второй профиль («стать блогером», «стать рекламодателем»);
        реквизиты в этом случае не меняются, но поля, обязательные для блогера, передаются.
        КПП, `tax_regime`, `vat_rate` и данные подписанта есть только у блогера (D-24):
        у рекламодателя они отклоняются. Допустимые `tax_regime` зависят от `legal_type`,
        допустимые `vat_rate` — от `tax_regime` (04 §2). Документ о режиме налогообложения
        загружается отдельно: `PUT /organizations/current/tax-document`.
        ИНН, уже принадлежащий другой организации, — `409` с кодом `inn_taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreate' }
            example:
              cabinet: advertiser
              legal_type: legal_entity
              inn: '7707083893'
              name: ООО «Тестовый рекламодатель»
              contact_name: Иван Тестов
              phone: '+79990000001'
              address: г. Москва, ул. Примерная, д. 1
      responses:
        '201':
          description: Организация создана или дополнена профилем
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /organizations/current:
    get:
      tags: [organizations]
      operationId: getCurrentOrganization
      summary: Реквизиты своей организации
      responses:
        '200':
          description: Организация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [organizations]
      operationId: updateCurrentOrganization
      summary: Изменить реквизиты
      description: ИНН и тип лица не меняются. Передаются только изменяемые поля.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationUpdate' }
            example: { phone: '+79990000002', bank_bik: '044525000' }
      responses:
        '200':
          description: Организация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /organizations/current/tax-document:
    put:
      tags: [organizations]
      operationId: uploadTaxDocument
      summary: Загрузить документ о режиме налогообложения
      description: |
        Документ, подтверждающий режим налогообложения и ставку НДС блогера (04 §2, `auth/org-blg`).
        Только для кабинета блогера. PDF, JPEG или PNG до 10 МБ; тип определяется по содержимому.
        Новый файл заменяет прежний.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Организация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------- legal
  /legal-documents:
    get:
      tags: [legal]
      operationId: listLegalDocuments
      summary: Действующие оферты и правила
      responses:
        '200':
          description: Документы
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LegalDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /legal-acceptances:
    post:
      tags: [legal]
      operationId: acceptLegalDocuments
      summary: Принять документы
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalAcceptanceRequest' }
            example: { legal_document_ids: ['0190a000-0000-7000-8000-000000000501'] }
      responses:
        '204': { description: Принято }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- notifications
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Уведомления пользователя
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: unread
          in: query
          description: Только непрочитанные
          schema: { type: boolean }
      responses:
        '200':
          description: Уведомления, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Отметить прочитанным
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Отмечено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- catalog
  /catalog/channels:
    get:
      tags: [catalog]
      operationId: listCatalogChannels
      summary: Каналы каталога
      description: |
        Нужен открытый кабинет рекламодателя. В каталоге виден канал в состоянии `active`, у которого
        есть включённая цена активного формата и подписчиков меньше порога РКН (10 000) или номер РКН
        подтверждён. Цены — итог для рекламодателя, с комиссией платформы.

        Цена для фильтра `price_from`/`price_to` и сортировок по цене и CPV — цена формата `format_id`,
        без него — минимальная включённая цена канала. `cpv` — эта цена, делённая на `avg_views`,
        в копейках с округлением вниз. Каналы без значения ключа сортировки (нет `avg_views`,
        `engagement_bp`) идут в конце; при равенстве ключа порядок — по `id`.

        Курсор относится к своей сортировке: курсор другой сортировки или испорченный — `422`
        с `details.reason = invalid_cursor`. При смене фильтров выдача начинается с первой страницы.
      parameters:
        - name: q
          in: query
          description: Поиск по названию и описанию
          schema: { type: string, maxLength: 100 }
        - name: category_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: format_id
          in: query
          description: Только каналы с включённой ценой этого формата; фильтр по цене применяется к нему
          schema: { $ref: '#/components/schemas/PlacementFormatId' }
        - name: price_from
          in: query
          schema: { $ref: '#/components/schemas/Money' }
        - name: price_to
          in: query
          schema: { $ref: '#/components/schemas/Money' }
        - name: subscribers_from
          in: query
          schema: { type: integer, minimum: 0 }
        - name: subscribers_to
          in: query
          schema: { type: integer, minimum: 0 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [subscribers_desc, price_asc, price_desc, engagement_desc, rating_desc, avg_views_desc, cpv_asc]
            default: subscribers_desc
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Каналы
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CatalogChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /catalog/channels/{id}:
    get:
      tags: [catalog]
      operationId: getCatalogChannel
      summary: Карточка канала
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogChannelDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /channel-categories:
    get:
      tags: [catalog]
      operationId: listChannelCategories
      summary: Справочник категорий каналов
      responses:
        '200':
          description: Категории по порядку
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /placement-formats:
    get:
      tags: [catalog]
      operationId: listPlacementFormats
      summary: Справочник форматов размещения
      responses:
        '200':
          description: Активные форматы по порядку
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlacementFormat' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- cart
  /cart:
    get:
      tags: [cart]
      operationId: getCart
      summary: Корзина
      description: Для каждой позиции — текущая цена и признаки, мешающие оформлению.
      responses:
        '200':
          description: Корзина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      summary: Добавить канал в корзину
      description: |
        Один канал — одна позиция. Канал должен быть виден в каталоге (иначе `404`).
        Повторное добавление канала — `409` с `details.reason = already_in_cart`.
        `422` с `details.reason`: `format_unavailable` — формат не активен или цена выключена;
        `own_channel` — канал принадлежит той же организации; `cart_full` — в корзине уже 50 позиций.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemCreate' }
            example: { channel_id: '0190a000-0000-7000-8000-000000000108', format_id: f_1_24 }
      responses:
        '201':
          description: Корзина после добавления
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /cart/items/{id}:
    patch:
      tags: [cart]
      operationId: updateCartItem
      summary: Сменить формат позиции или подтвердить цену
      description: |
        Меняет формат позиции и запоминает текущий итог как показанный (`shown_total_amount`).
        Запрос с тем же форматом подтверждает изменившуюся цену (снимает `price_changed`).
        `422` с `details.reason = format_unavailable` — формат не активен или цена выключена.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemUpdate' }
            example: { format_id: f_2_48 }
      responses:
        '200':
          description: Корзина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [cart]
      operationId: deleteCartItem
      summary: Убрать позицию
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Корзина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- campaigns
  /campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: Кампании рекламодателя
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CampaignStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Кампании, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: Новая кампания
      description: |
        Создаёт кампанию в `draft` и пустой пост к ней (D-16). Обязательно только `name`.

        Проверки формы (A-39; полнота кампании проверяется при оплате). Отказ — `422`,
        причина в `details.reason`, поле — в `details.field`:
        - `required` — нет `name` или оно пустое после обрезки пробелов;
        - `period_order` — `date_from` позже `date_to`;
        - `period_too_long` — период длиннее 14 суток;
        - `period_in_past` — `date_from` раньше сегодняшнего дня по Москве;
        - `time_pair` — задано только одно из `time_from`, `time_to`;
        - `time_window` — `time_from` не раньше `time_to` или окно короче 1 часа.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
            example:
              name: Осенняя распродажа
              date_from: '2026-10-20'
              date_to: '2026-10-25'
              time_from: '10:00'
              time_to: '20:00'
              extra_requirements: Не публиковать рядом с рекламой конкурентов
      responses:
        '201':
          description: Кампания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{id}:
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: Кампания
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Кампания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [campaigns]
      operationId: updateCampaign
      summary: Изменить кампанию
      description: |
        Меняет только переданные поля; отсутствующее поле не меняется. Очистить поле нельзя:
        `null` и пустая строка не принимаются.

        Наименование меняется всегда; период дат и времени и `extra_requirements` — только в `draft`,
        иначе `409` с `details.reason = not_draft`. Новое значение проверяется вместе с сохранёнными
        полями по тем же правилам, что и в `createCampaign` (`422`, причины там же).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
            example: { name: Осенняя распродажа — 2 }
      responses:
        '200':
          description: Кампания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{id}/post:
    get:
      tags: [campaigns]
      operationId: getCampaignPost
      summary: Черновик поста кампании
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Черновик
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [campaigns]
      operationId: saveCampaignPost
      summary: Сохранить черновик поста
      description: |
        Сохраняет документ редактора, порядок изображений альбома и место токена.
        Черновик можно править и после оформления заказа; в заказ правка попадает только
        через новую версию (`POST /orders/{id}/post-versions`, S-29).

        Перед сохранением документ нормализуется: CRLF и CR заменяются на LF, табуляция — на пробел,
        прочие управляющие символы удаляются; повторы меток в узле убираются; пустые узлы удаляются,
        соседние узлы с одинаковыми метками сливаются; пустой абзац сохраняется. Затем адреса `https://`
        в тексте без ссылки становятся ссылками (D-22): адрес заканчивается пробелом или концом строки,
        в него не входят завершающие `.,;:!?»"'` и `)` без парной `(`. Ответ содержит документ
        после нормализации и распознавания ссылок.

        Если поля места токена не переданы: `token_carrier = media` при наличии изображений, иначе `text`;
        `token_position = below`. Недоступное сочетание не отклоняется, а показывается проблемой предпросмотра.
        Текст длиннее 3800 знаков сохраняется — предпросмотр покажет `body_too_long`.

        Отказ — `422`, причина в `details.reason`:
        - `invalid_doc` — нарушено ограничение документа, путь узла в `details.path` (например,
          `content.2.content.0`), уточнение в `details.rule`: `too_many_blocks` (больше 300),
          `too_many_nodes` (больше 3000 текстовых узлов), `doc_too_large` (JSON больше 128 КБ),
          `href_required`, `href_unexpected`, `href_invalid` (не `https://`, нет хоста, есть
          `userinfo` или пробел, длиннее 2048);
        - `too_long` — сериализованный текст длиннее 8000 знаков;
        - `media_not_found` — файла нет, он удалён или чужой, идентификатор в `details.media_file_id`;
        - `duplicate_media` — файл повторяется в альбоме.

        Длина считается в кодовых единицах UTF-16 сериализованного текста вместе с разметкой.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostDraftInput' }
            example:
              content_doc:
                type: doc
                content:
                  - type: heading
                    content: [{ type: text, text: Осенняя распродажа }]
                  - type: paragraph
                    content:
                      - { type: text, text: 'Скидки до 50% — ' }
                      - type: text
                        text: только неделю
                        marks: [{ type: bold }]
                      - { type: text, text: '. Подробности: https://shop.example.test/sale' }
              media_file_ids: ['0190a000-0000-7000-8000-000000000401']
              token_carrier: media
              token_position: below
      responses:
        '200':
          description: Черновик
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{id}/post/preview:
    post:
      tags: [campaigns]
      operationId: previewCampaignPost
      summary: Предпросмотр поста (S-05)
      description: |
        Сериализует сохранённый черновик в формат MAX и собирает пример итогового текста
        со строкой маркировки; erid в примере условный. Возвращает нарушения автоматических проверок.

        UTM-метки (A-21) в предпросмотре содержат заглушку номера заказа `order_0000000000`
        фиксированной ширины, поэтому длина не занижается. `media_urls` — подписанные ссылки
        со сроком действия; пока изображения с плашкой или их копии строятся, ссылок на них нет
        и в `problems` есть `media_processing` — предпросмотр нужно запросить ещё раз.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Предпросмотр
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{id}/checkout:
    post:
      tags: [campaigns]
      operationId: checkoutCampaign
      summary: Оплатить кампанию (S-06, P-01)
      description: |
        Оформляет заказ из всех позиций корзины: создаёт версию поста 1 в `pending_moderation`,
        заказ в `moderation` и по размещению в `created` на каждую позицию; удерживает деньги
        с баланса; очищает корзину; кампания переходит в `ordered`.
        Отказ — `409` с кодом:
        - `campaign_incomplete` — кампания не готова к оплате; `details.missing_fields` — незаполненные или
          недопустимые поля (`date_from`, `date_to`, `time_from`, `time_to`), `details.post_problems` — коды
          проблем поста из предпросмотра;
        - `cart_changed` — корзина пуста, канал недоступен, формат выключен или цена изменилась;
          `details.items` — идентификаторы позиций;
        - `insufficient_balance` — `details.missing_amount` — недостающая сумма в копейках;
        - `conflict` — кампания не в `draft`.
        Повтор с тем же `Idempotency-Key` возвращает созданный заказ.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- media
  /media:
    get:
      tags: [media]
      operationId: listMedia
      summary: Файлы медиатеки
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Файлы, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MediaFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Загрузить изображение
      description: |
        JPEG, PNG или WebP до 50 МБ; каждая сторона — от 160 до 7680 пикселей с учётом поворота EXIF.
        Тип определяется по содержимому, расширение имени не учитывается. Анимированные PNG и WebP
        не принимаются. Оригинал хранится без изменений и наружу не публикуется.
        Повторная загрузка того же файла (совпадает SHA-256) в организации возвращает существующую запись.

        Отказ — `422` с `details.field = file` и причиной в `details.reason`:
        `required` (нет части `file`), `empty`, `too_large`, `unsupported_type`, `animated`,
        `too_small`, `too_big_dimensions`, `malformed`. Тело больше предела тоже даёт `too_large`.
        Больше 60 загрузок в час на пользователя или больше 4 одновременных загрузок на сервер — `429`.

        Тестовый сервер проверяет только тип и размер, файл не хранит, размеры берёт условные.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Файл
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /media/{id}:
    delete:
      tags: [media]
      operationId: deleteMedia
      summary: Удалить файл
      description: |
        Мягкое удаление. Файл убирается из черновиков постов всех кампаний организации.
        Файл, использованный в версии поста, остаётся в ней.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- orders
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Заказы рекламодателя
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Заказы, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Заказ с размещениями
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/post-versions:
    post:
      tags: [orders]
      operationId: createOrderPostVersion
      summary: Отправить изменённый пост (S-29, P-11)
      description: |
        Создаёт следующую версию поста из текущего черновика кампании и отправляет её на модерацию.
        Размещения в `awaiting_blogger`, `awaiting_schedule`, `scheduled` возвращаются в `created` (P-11);
        опубликованные не меняются. Размещения, у которых до конца окна дат меньше 24 ч, отменяются
        (P-06, `window_elapsed`). Для размещений в `created` деньги удерживаются заново.
        Доступно, когда заказ в `rejected` или `in_progress`. Отказ — `409`:
        `details.reason = post_version_in_progress` — текущая версия на модерации или регистрации;
        `nothing_to_update` — нет размещений до публикации; код `insufficient_balance` с
        `details.missing_amount`; код `campaign_incomplete` с `details.post_problems`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Заказ с новой текущей версией
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /orders/{id}/cancel:
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Отменить заказ (S-07, P-06)
      description: |
        Отменяет размещения заказа в `created` и `awaiting_blogger` (P-06, `advertiser_cancel`);
        остальные не меняются. Удержания снимаются. Нечего отменять — `409` с
        `details.reason = nothing_to_cancel`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/report:
    get:
      tags: [orders]
      operationId: getOrderReport
      summary: Отчёт по кампании (S-09)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /placements/{id}/cancel:
    post:
      tags: [orders]
      operationId: cancelPlacement
      summary: Отменить размещение (P-06)
      description: Допустимо из `created` и `awaiting_blogger`. Удержание снимается, деньги возвращаются на баланс.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertiserPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /placements/{id}/accept:
    post:
      tags: [orders]
      operationId: acceptPlacement
      summary: Принять размещение (P-12)
      description: Допустимо из `removed`. Удержание распределяется, создаётся выплата блогеру.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertiserPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /placements/{id}/claims:
    post:
      tags: [orders]
      operationId: createPlacementClaim
      summary: Подать претензию (S-08, P-14)
      description: |
        Допустимо из `published` и из `removed` до `claim_deadline_at`. По размещению — одна претензия.
        Размещение переходит в `disputed`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimCreate' }
            example: { reason: removed_early, text: Пост удалён через 3 часа после публикации }
      responses:
        '201':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertiserPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

