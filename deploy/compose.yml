# Тестовый стенд заглушки API (см. deploy/README.md).
# На сервере лежит в /opt/maxim рядом с .env; копируется workflow деплоя.
# HTTPS и проксирование — общий edge-прокси сервера (/opt/edge, сеть `edge`):
# сайт стенда описан в deploy/maxim.caddy.
name: maxim

services:
  mockapi:
    image: ghcr.io/leha-creator/maxim-mockapi:${MOCKAPI_TAG:-master}
    restart: unless-stopped
    environment:
      MOCKAPI_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      MOCKAPI_COOKIE_SECURE: "true"
    # Порт наружу не публикуется: доступ только через edge-прокси.
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    networks:
      maxim: {}
      # Алиас уникален в общей сети edge (там же сервисы других проектов).
      edge:
        aliases: [maxim-mockapi]

networks:
  maxim: {}
  edge:
    external: true
    name: edge
